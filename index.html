<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ===================== level + physics (src/core.js) =====================
// Level data and player physics. No DOM: the game inlines this file and test_level.mjs imports it.
// Units: px, x = 0..720 across the play plane, y = height above the kitchen counter (up is +). 1px = 1mm in the 3D scene.
const W = 720, WALL = 30, DT = 1 / 120;
const GRAV = 5200, TERMINAL = 2600, BOUNCE = .6;
const CHARGE_T = .25, JUMP_MIN = .35;   // seconds to a full charge; share of the full height an instant release still gets
const JUMP_V = 1650, DASH_V = 1300, AIM_MAX = 42, AIM_SPEED = [130, 150, 165, 180, 195];   // arrow sweep in deg/s, per zone
const PW = 40, PH = 84;
const TILE_FRICTION = 2400;
const NET = -2, NET_DROP = 150;   // on === NET: standing on a safety net (easy mode only)

// aim is a phase in [0, 4): 0 center going right, 1 right end, 2 center going left, 3 left end
const aimDeg = a => (a < 1 ? a : a < 3 ? 2 - a : a - 4) * AIM_MAX;
// height is linear in the charge, so speed goes with its square root
const jumpV = (deg, c = CHARGE_T) => { const v = JUMP_V * Math.sqrt(JUMP_MIN + (1 - JUMP_MIN) * c / CHARGE_T); return [v * Math.sin(deg * Math.PI / 180), v * Math.cos(deg * Math.PI / 180)]; };

// k: counter board steamer beam post mandu tile cloud gold | x = center, y = top, w, h | amp/per/ph = horizontal sway | cp = checkpoint
const p = (k, x, y, w, o = {}) => ({ k, x, y, w, h: { counter: 400, steamer: 56, mandu: 46, cloud: 34, post: 300 }[k] ?? 30, ...o });
const LEVEL = [
  p('counter', 360, 0, 720),
  // ---- kitchen: nothing moves ----
  p('board', 170, 170, 220),
  p('steamer', 540, 240, 240),
  p('board', 270, 390, 180),
  p('steamer', 560, 560, 170),
  p('board', 210, 720, 150),
  p('beam', 470, 900, 120),
  p('steamer', 630, 1090, 110),
  p('beam', 300, 1180, 330),   // wide shelf, also a roof for anyone jumping from the board below
  p('board', 105, 1390, 100),
  p('steamer', 380, 1580, 120),
  p('beam', 640, 1760, 100),
  p('beam', 400, 1960, 200, { cp: 1 }),
  // ---- 2nd floor: mandus sway ----
  p('mandu', 170, 2140, 140, { amp: 50, per: 3.2 }),
  p('beam', 420, 2330, 130),
  p('mandu', 620, 2510, 130, { amp: 25, per: 2.6 }),
  p('mandu', 370, 2690, 130, { amp: 80, per: 3.4 }),
  p('beam', 120, 2870, 130),
  p('mandu', 340, 3050, 120, { amp: 70, per: 3, ph: 1 }),
  p('post', 520, 3200, 44),    // has to be jumped over
  p('beam', 640, 3240, 130),
  p('mandu', 380, 3430, 120, { amp: 60, per: 2.8 }),
  p('beam', 130, 3610, 130),
  p('beam', 370, 3800, 210, { cp: 1 }),
  // ---- eaves: tiles keep you sliding ----
  p('tile', 620, 3980, 230),
  p('tile', 330, 4150, 230),
  p('tile', 120, 4320, 180),
  p('tile', 350, 4500, 170),
  p('tile', 600, 4680, 210),
  p('beam', 350, 4870, 230, { cp: 1 }),
  // ---- above the clouds: gusts push you in the air ----
  p('cloud', 130, 5050, 180),
  p('cloud', 370, 5230, 170),
  p('cloud', 610, 5410, 170),
  p('cloud', 390, 5600, 160),
  p('cloud', 150, 5780, 160),
  p('cloud', 370, 5970, 150),
  p('cloud', 590, 6150, 150),
  p('cloud', 360, 6330, 150),
  p('cloud', 130, 6510, 150),
  p('cloud', 350, 6700, 140),
  p('cloud', 590, 6880, 150),
  p('cloud', 380, 7060, 140),
  p('cloud', 140, 7240, 150),
  p('cloud', 350, 7420, 150),
  p('cloud', 600, 7610, 200, { cp: 1 }),
  // ---- under the moon: everything at once ----
  p('mandu', 370, 7790, 120, { amp: 50, per: 3 }),
  p('mandu', 130, 7970, 110, { amp: 30, per: 2.8 }),
  p('mandu', 370, 8150, 110, { amp: 70, per: 3 }),
  p('mandu', 610, 8330, 110, { amp: 30, per: 2.6 }),
  p('tile', 370, 8510, 160),
  p('mandu', 130, 8690, 110, { amp: 30, per: 2.8 }),
  p('mandu', 370, 8870, 110, { amp: 70, per: 3, ph: 2 }),
  p('cloud', 610, 9050, 130),
  p('tile', 370, 9230, 180),
  p('mandu', 120, 9410, 125, { amp: 25, per: 2.6 }),
  p('mandu', 340, 9590, 125, { amp: 45, per: 2.8 }),
  p('mandu', 600, 9690, 125, { amp: 20, per: 3 }),
  p('gold', 360, 9880, 220),
];
const GOAL_Y = LEVEL[LEVEL.length - 1].y;

const ZONES = [
  { y: 0, name: '주방', sub: '오래 누를수록 높이 뛴다. 공중에서 누르면 경공!' },
  { y: 1960, name: '객잔 2층', sub: '만두가 흔들린다. 벽을 차면 경공이 충전된다.' },
  { y: 3800, name: '처마', sub: '기와는 미끄럽다. 멈추기 전에 뛰어라.' },
  { y: 4870, name: '구름 위', sub: '돌풍이 공중에서 밀어낸다.' },
  { y: 7610, name: '달 아래', sub: '황금 만두가 코앞이다.' },
];
const zoneAt = y => { let i = 0; while (i + 1 < ZONES.length && y >= ZONES[i + 1].y) i++; return i; };

const platX = (pl, t) => pl.amp ? pl.x + pl.amp * Math.sin(2 * Math.PI * t / pl.per + (pl.ph || 0)) : pl.x;

const WIND = [{ y0: 4890, y1: 7610, a: 420, per: 5 }, { y0: 7610, y1: 12000, a: 300, per: 3.8 }];
function windAt(y, t) {
  for (const z of WIND) if (y >= z.y0 && y < z.y1) {
    const s = Math.sin(2 * Math.PI * t / z.per);
    return z.a * Math.sign(s) * Math.min(1, Math.max(0, (Math.abs(s) - .3) / .3));
  }
  return 0;
}

const newPlayer = (x = 350, y = 0, on = 0) => ({ x, y, vx: 0, vy: 0, on, aim: 0, dash: 1, charge: -1, groundY: y, peak: y, netY: -1e9 });

function hits(P, pl, t) {
  const px = platX(pl, t);
  return Math.abs(P.x - px) < pl.w / 2 + PW / 2 && P.y < pl.y && P.y + PH > pl.y - pl.h;
}

function jump(P, ev) {
  const deg = aimDeg(P.aim), [vx, vy] = jumpV(deg, P.charge);
  P.vx = vx; P.vy = vy; P.on = -1; P.peak = P.y; P.charge = -1;
  ev.push({ e: 'jump', deg });
}

// one fixed step. t = sim time at the start of the step, tap = a new press, hold = the press is still down.
// Standing: a press freezes the arrow and charges, letting go jumps. In the air: a press is qinggong. Returns the events of this step.
function step(P, t, tap, hold) {
  const ev = [], t1 = t + DT;
  if (P.on !== -1) {
    const pl = P.on === NET ? null : LEVEL[P.on];
    if (pl) P.x += platX(pl, t1) - platX(pl, t);
    if (pl && pl.k === 'tile' && P.vx) {
      const v = Math.abs(P.vx) - TILE_FRICTION * DT;
      P.vx = v <= 0 ? 0 : Math.sign(P.vx) * v;
      P.x += P.vx * DT;
    } else P.vx = 0;
    if (P.x < WALL + PW / 2) { P.x = WALL + PW / 2; P.vx = 0; }
    if (P.x > W - WALL - PW / 2) { P.x = W - WALL - PW / 2; P.vx = 0; }
    if (pl && Math.abs(P.x - platX(pl, t1)) > pl.w / 2 + PW / 2) {   // slid off the edge
      P.on = -1; P.vy = 0; P.peak = P.y; P.charge = -1;
      ev.push({ e: 'slipoff' });
      return ev;
    }
    if (P.charge >= 0) {
      if (hold) P.charge = Math.min(CHARGE_T, P.charge + DT);
      else jump(P, ev);
      return ev;
    }
    P.aim = (P.aim + AIM_SPEED[zoneAt(P.y)] / AIM_MAX * DT) % 4;
    if (tap) P.charge = 0;
    return ev;
  }

  P.aim = (P.aim + AIM_SPEED[zoneAt(P.y)] / AIM_MAX * DT) % 4;
  if (tap && P.dash > 0) {     // qinggong: one more leap along the arrow, recharged by landing or kicking a wall
    const deg = aimDeg(P.aim), r = deg * Math.PI / 180;
    P.vx = DASH_V * Math.sin(r); P.vy = DASH_V * Math.cos(r); P.dash = 0;
    ev.push({ e: 'dash', deg });
  }
  P.vx += windAt(P.y, t) * DT;
  P.vy = Math.max(P.vy - GRAV * DT, -TERMINAL);

  P.x += P.vx * DT;
  if (P.x < WALL + PW / 2) { P.x = WALL + PW / 2; P.vx = Math.abs(P.vx) * BOUNCE; P.dash = 1; ev.push({ e: 'wall' }); }
  if (P.x > W - WALL - PW / 2) { P.x = W - WALL - PW / 2; P.vx = -Math.abs(P.vx) * BOUNCE; P.dash = 1; ev.push({ e: 'wall' }); }
  for (const pl of LEVEL) {
    if (P.y > pl.y + 1 || P.y + PH < pl.y - pl.h - 1 || !hits(P, pl, t1)) continue;
    const px = platX(pl, t1), side = P.x < px ? -1 : 1;
    P.x = px + side * (pl.w / 2 + PW / 2 + .01);
    if (P.vx * side < 0) { P.vx = -P.vx * BOUNCE; ev.push({ e: 'side' }); }
  }

  const y0 = P.y;
  P.y += P.vy * DT;
  P.peak = Math.max(P.peak, P.y);
  for (let i = 0; i < LEVEL.length; i++) {
    const pl = LEVEL[i];
    if (P.y > pl.y + 40 || P.y + PH < pl.y - pl.h - 40 || !hits(P, pl, t1)) continue;
    if (P.vy <= 0 && y0 >= pl.y - 1e-6) return land(P, i, pl.y, ev, Math.abs(P.x - platX(pl, t1)) / (pl.w / 2));
    if (P.vy > 0) { P.y = pl.y - pl.h - PH - .01; P.vy = 0; ev.push({ e: 'bonk' }); }
  }
  if (P.vy <= 0 && y0 >= P.netY && P.y < P.netY) return land(P, NET, P.netY, ev);
  return ev;
}

function land(P, i, y, ev, off = 1) {
  const drop = P.groundY - y, tile = i >= 0 && LEVEL[i].k === 'tile';
  P.aim = P.vx > 0 ? 2 : 0; P.dash = 1;   // the arrow starts at the center, swinging back the way you came
  P.y = y; P.on = i; P.vy = 0; P.vx = tile ? P.vx * .85 : 0; P.groundY = y;
  ev.push({ e: 'land', i, drop, peakDrop: P.peak - y, perfect: i > 0 && drop < 0 && off < .3 });
  if (i >= 0 && LEVEL[i].k === 'gold') ev.push({ e: 'goal' });
  return ev;
}

// where a jump would go if released right now (a full charge before pressing): the dotted arc on the easy path
function previewArc(P, t, max = 150, every = 6) {
  const Q = { ...P, charge: P.charge < 0 ? CHARGE_T : P.charge }, pts = [];
  jump(Q, []);
  for (let i = 0; i < max && Q.on === -1; i++) {
    step(Q, t + i * DT, false, false);
    if (i % every === 0) pts.push([Q.x, Q.y]);
  }
  return pts;

const H = 1080;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const fmtTime = s => { const m = Math.floor(s / 60); return `${m}분 ${String(Math.floor(s % 60)).padStart(2, '0')}초`; };
const RUN_NAME = { hard: '협객의 길', easy: '수련의 길' };
const SAVE = 'ngh_climb3_save', BEST = r => 'ngh_climb3_best_' + r;
const BANNER = 1.9;
// ponytail: thresholds are a first guess from bot runs, tune them after real players post times
const RANKS = [[100, 2, '천하제일'], [170, 8, '절정고수'], [270, 20, '일류'], [480, 50, '이류'], [1e9, 1e9, '삼류']];
const rankOf = (time, falls) => RANKS.find(([t, f]) => time <= t && falls <= f)[2];

// ===================== sound =====================
let ac = null;
function beep(freqs, dur = .09, type = 'triangle', vol = .18) {
  if (!ac) return;
  let t = ac.currentTime;
  for (const f of freqs) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
    t += dur * .8;
  }
}
function sweep(f0, f1, dur, vol = .1, type = 'sine') {
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}

// 8-bit BGM, a new loop for the climb. 8th-note steps, 8 bars. 0 = rest, -1 = hold.
const LEAD = [62, 0, 66, 69, 74, 0, 69, 0,  71, 0, 74, 76, 78, -1, 76, 0,  74, 0, 71, 69, 66, 0, 69, 71,  69, -1, -1, -1, 0, 0, 66, 69,
              71, 0, 74, 0, 76, 0, 78, 81,  83, -1, 81, 78, 76, 0, 74, 0,  71, 74, 76, 78, 76, 74, 71, 69,  74, -1, -1, -1, 0, 0, 0, 0];
const ROOTS = [38, 31, 35, 33, 31, 35, 33, 38];          // D G Bm A G Bm A D
const BASS = [0, null, 12, null, 7, null, 12, null];
const music = { on: true, next: 0, step: 0, gain: null, noise: null, timer: 0 };
music.on = store.get('ngh_climb_music') !== false;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function tone(type, f, t, dur, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006);
  g.gain.setValueAtTime(vol, t + dur * .7); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(music.gain); o.start(t); o.stop(t + dur + .02);
}
function hit(t, kind) {
  if (kind === 'k') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .12);
    g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .15);
    o.connect(g).connect(music.gain); o.start(t); o.stop(t + .16); return;
  }
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  const hat = kind === 'h', v = hat ? .12 : .35, d = hat ? .03 : .12;
  src.buffer = music.noise; f.type = 'highpass'; f.frequency.value = hat ? 7000 : 1500;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  src.connect(f).connect(g).connect(music.gain); src.start(t); src.stop(t + d + .01);
}
function schedule() {
  const st = 60 / (150 + Math.min(30, S.combo * 2)) / 2, high = S.bestZone >= 3;    // above the clouds: lead an octave up on a softer voice, no kick or snare
  while (music.next < ac.currentTime + .15) {
    const i = music.step % LEAD.length, t = music.next, bar = i >> 3, k = i & 7, n = LEAD[i];
    if (n > 0) { let len = 1; while (LEAD[(i + len) % LEAD.length] === -1) len++; tone(high ? 'triangle' : 'square', midi(n + (high ? 12 : 0)), t, st * len * .92, high ? .3 : .16); }
    if (BASS[k] !== null) tone('triangle', midi(ROOTS[bar] + BASS[k]), t, st * .9, high ? .3 : .5);
    if (!high && (k === 0 || k === 4)) hit(t, 'k');
    if (!high && (k === 2 || k === 6)) hit(t, 's');
    hit(t, 'h');
    music.next += st; music.step++;
  }
}
function audioStart() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }

    } else if (S.combo > 2 && ev.drop < 0) say(`${S.combo} 연속`, P.x, P.y + 150, '#fff2d8', .55);

    } else {

function update(dt) {
  S.t += dt;
  S.shake = Math.max(0, S.shake - dt * 40);
  if (S.mode === 'play') {
    S.time += dt;
    S.stun = Math.max(0, S.stun - dt); S.splat = Math.max(0, S.splat - dt);
    if (S.hitstop > 0) { S.hitstop -= dt; dt = 0; }
    S.acc += dt;
    while (S.acc >= DT && S.mode === 'play') {
      S.acc -= DT;
      const tap = S.tap && S.stun <= 0;
      S.tap = false;
      for (const ev of step(S.P, S.simT, tap, S.held)) handle(ev);
      if (S.P.on === -1 && S.simT % .0249 < DT) S.trail.push({ x: S.P.x, y: S.P.y, f: frameIndex(), r: spriteRot(), life: .16 });
      S.simT += DT;
    }
    const P = S.P;
    if (P.charge >= 0) {   // where the feet would peak if let go right now
      const deg = aimDeg(P.aim), peak = c => { const v = jumpV(deg, c)[1]; return P.y + v * v / (2 * GRAV) - v * DT / 2; };
      S.gauge = { y0: P.y, top: peak(P.charge), max: peak(CHARGE_T), side: deg > 0 ? -1 : 1 };
    }
    S.landT = Math.max(0, S.landT - dt);
    if (P.on === -1 && !S.screamed && P.peak - P.y > 900) {
      S.screamed = true; say('으아아아아!', P.x, P.y + 150, '#ff9a6a', 1.2); sweep(1100, 240, 1.1, .05, 'triangle');
    }
  } else if (S.mode === 'goal') {
    S.simT += dt;
    S.goalT += dt;
    if (S.goalT > 2.6) showEnd();
    if (Math.random() < dt * 14) puffGold();
  } else if (S.mode === 'title' || S.mode === 'end') {
    S.simT += dt;
  }
  for (const t of S.texts) { t.y += 90 * dt; t.life -= dt; }
  S.spin = Math.max(0, S.spin - dt);
  for (const f of S.fx) f.life -= dt;
  S.fx = S.fx.filter(f => f.life > 0);
  for (const f of S.trail) f.life -= dt;
  S.trail = S.trail.filter(f => f.life > 0);
  S.texts = S.texts.filter(t => t.life > 0);
  if (S.banner && (S.banner.life -= dt) <= 0) S.banner = null;
  for (const m of Object.values(plat)) m.sq = Math.max(0, m.sq - dt * 3.6);
  // camera: the ground you stand on sits low on screen; an airborne player only drags it when leaving the frame
  const P = S.P;
  if (S.mode === 'title') {
    S.cam = 438 + (1 - Math.cos(S.t * .11)) / 2 * (GOAL_Y - 200);
  } else {
    let target = Math.max(438, (P.on === -1 ? P.groundY : P.y) + 180);
    const sy = 540 - (P.y - S.cam);
    if (P.on === -1 && (sy < 170 || sy > 900)) target = P.y + (sy < 170 ? -300 : 180);
    S.cam += (target - S.cam) * Math.min(1, dt * (P.on === -1 && P.vy < -1200 ? 16 : 10));
  }
}

  }

  // height + time + falls
  hx.textAlign = 'left'; hx.font = '56px Jua, sans-serif';
  outlined(`${(P.y / 1000).toFixed(1)}m`, 52, 80, '#ffd27a', 10);
  hx.font = '26px Jua, sans-serif';
  outlined(`${fmtTime(S.time)} · 추락 ${S.falls}번`, 54, 118, '#fff7ea', 6);
  if (S.combo > 1) { hx.font = '44px Jua, sans-serif'; outlined(`${S.combo} 연속`, 52, 170, '#ffd34d', 8); }

  // tower map on the right chopstick
  const my0 = 880, my1 = 200, mapY = y => my0 + (my1 - my0) * y / GOAL_Y, mxx = 672;
  hx.lineCap = 'round'; hx.strokeStyle = 'rgba(20,10,5,.7)'; hx.lineWidth = 12; hx.beginPath(); hx.moveTo(mxx, my0); hx.lineTo(mxx, my1); hx.stroke();
  hx.strokeStyle = 'rgba(255,235,200,.55)'; hx.lineWidth = 4; hx.beginPath(); hx.moveTo(mxx, my0); hx.lineTo(mxx, my1); hx.stroke();
  hx.fillStyle = 'rgba(255,235,200,.9)'; for (const z of ZONES) hx.fillRect(mxx - 9, mapY(z.y) - 1.5, 18, 3);
  hx.fillStyle = '#ffc83c'; hx.beginPath(); hx.arc(mxx, my1, 9, 0, 7); hx.fill();
  hx.strokeStyle = '#ff8a7a'; hx.lineWidth = 3; hx.beginPath(); hx.moveTo(mxx - 11, mapY(S.maxY)); hx.lineTo(mxx + 11, mapY(S.maxY)); hx.stroke();
  hx.fillStyle = '#fff'; hx.strokeStyle = '#3a1606'; hx.lineWidth = 4; hx.beginPath(); hx.arc(mxx, mapY(Math.max(0, P.y)), 8, 0, 7); hx.stroke(); hx.fill();

  // hint until the third jump
  if (S.dashes < 2 && S.mode === 'play') {
    hx.textAlign = 'center'; hx.font = '40px Jua, sans-serif';
    hx.globalAlpha = .7 + Math.sin(S.t * 4) * .3; outlined(P.on === -1 ? '공중에서 누르면 경공!' : '꾹 눌렀다 떼면 도약', 360, 1030, '#fff7ea', 8);
    hx.globalAlpha = 1;
  }
}

let last = 0, manual = false;
function loop(now) {
  const dt = Math.min((now - last) / 1000 || 0, 1 / 30); last = now;
  if (!manual) { update(dt); updateSteam(dt); render3D(); drawHud(); adapt(dt); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// test hooks, localhost only
const draw = () => { updateSteam(1 / 60); render3D(); drawHud(); };
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) Object.assign(window, { __game: { get S() { return S; }, update, draw, manual: v => { manual = v; }, begin, toTitle, renderer, core: { LEVEL, step, platX, windAt, newPlayer, DT, GOAL_Y, previewArc, aimDeg, ZONES } } });
</script>
